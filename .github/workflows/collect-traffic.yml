name: M0 traffic collection (backup)

# NOT the primary scheduler. A `*/5` schedule here was measured producing two
# runs in eleven hours, not the ~130 it implies: GitHub runs the schedule
# event on shared best-effort infrastructure and does not honour short
# intervals. The every-5-minutes collection M0 needs (PRD §12) runs from an
# external cron service instead, hitting the same endpoint.
#
# This stays as an hourly safety net: if the external scheduler dies quietly,
# some data keeps landing and the failures stay visible in the Actions tab.
# Double-collecting is harmless — the endpoint drops rows it already has.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/cron/collect
        run: |
          status=$(curl -sS -o /tmp/body.json -w "%{http_code}" \
            -X POST "https://hsinchu-fab-route.vercel.app/api/cron/collect" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP $status"
          cat /tmp/body.json
          if [ "$status" -ge 300 ]; then
            echo "Collection call failed"
            exit 1
          fi
